metadata: { expect: 1 }
rule:
  kind: method_declaration
  pattern: $F
  has: { field: name, regex: ^onDiagnostic$ }
fix: |-
  private static void addDependencyPlugins(TeaVM teavm) {
      var object = ValueType.object("java.lang.Object");
      var arrayClass = "java.lang.reflect.Array";
      var arrayPlugin = new ArrayDependencyPlugin();
      teavm.add(new MethodReference("java.lang.Object", "clone", object), new ObjectDependencyPlugin());
      teavm.add(new MethodReference(arrayClass, "getLength", object, ValueType.INTEGER), arrayPlugin);
      teavm.add(new MethodReference(arrayClass, "newInstance", ValueType.object("java.lang.Class"),
              ValueType.INTEGER, object), arrayPlugin);
      teavm.add(new MethodReference(arrayClass, "get", object, ValueType.INTEGER, object), arrayPlugin);
      teavm.add(new MethodReference(arrayClass, "set", object, ValueType.INTEGER, object, ValueType.VOID),
              arrayPlugin);
  }

  $F
