id: compiler-compile
language: java
files: [compiler/src/main/java/org/teavm/javac/Compiler.java]
metadata: { expect: 1 }
rule:
  kind: method_declaration
  has: { field: name, regex: ^compile$ }
  pattern: $F
fix: |-
  @JSExport
  public boolean compile() {
      disposeAnalysis();
      sourceMains.clear();
      wasmOutputFiles.clear();
      invalidateRuntime();
      boolean success = false;
      try {
          initCompiler();
          success = compiler.simpleCompile();
          return success;
      } finally {
          closeCompiler();
          if (!success) {
              clearOutputFiles();
              sourceMains.clear();
          }
      }
  }

  private void invalidateRuntime() {
      classSource = null;
      resourceProvider = null;
      wasmOutputFiles.clear();
  }

  private void invalidateInputs() {
      disposeAnalysis();
      sourceMains.clear();
      invalidateRuntime();
  }

  private void closeCompiler() {
      JavaCompiler current = compiler;
      if (current == null && compilerContext != null) {
          current = compilerContext.get(JavaCompiler.compilerKey);
      }
      compiler = null;
      compilerContext = null;
      if (current != null) {
          current.close();
      }
  }

  @JSExport
  public void disposeAnalysis() {
      analysis = null;
      closeCompiler();
  }

  @JSExport
  public boolean analyze() {
      disposeAnalysis();
      sourceMains.clear();
      try {
          initCompiler();
          boolean success = compiler.simpleAnalyze();
          analysis = new SemanticAnalysis(compilerContext, compiler.units, sourceFiles, classFiles, sdkFiles);
          analysis.captureMains(sourceMains);
          return success;
      } catch (RuntimeException | Error failure) {
          disposeAnalysis();
          throw failure;
      }
  }

  private SemanticAnalysis requireAnalysis() {
      if (analysis == null) {
          throw new IllegalStateException("No analysis snapshot");
      }
      return analysis;
  }

  @JSExport
  public EditorHover hover(String fileName, int offset) {
      return requireAnalysis().hover(fileName, offset);
  }

  @JSExport
  public EditorLocation definition(String fileName, int offset) {
      return requireAnalysis().definition(fileName, offset);
  }

  @JSExport
  public MainClass[] mainClassesIn(String fileName) {
      if (!sourceFiles.containsKey(fileName)) {
          throw new IllegalArgumentException("Unknown source: " + fileName);
      }
      var mains = sourceMains.get(fileName);
      if (mains == null) {
          throw new IllegalStateException("No source main metadata");
      }
      return mains.clone();
  }

  @JSExport
  public String getOutputSourceFile(String name) {
      return outputSources.get(name);
  }

  @JSExport
  public MainClass mainClass(String binaryName) throws IOException {
      var path = binaryName.replace('.', '/') + ".class";
      var file = outputFiles.getOrDefault(path, classFiles.get(path));
      if (file == null) {
          return null;
      }
      var finder = new MainMethodFinder();
      new ClassReader(file.data).accept(finder, ClassReader.SKIP_CODE | ClassReader.SKIP_DEBUG);
      if (!finder.hasMainMethod) {
          return null;
      }
      var privateCompiler = new Compiler();
      privateCompiler.sdkFiles.putAll(sdkFiles);
      privateCompiler.classFiles.putAll(classFiles);
      privateCompiler.outputFiles.putAll(outputFiles);
      try {
          privateCompiler.initCompiler();
          privateCompiler.compiler.initModules(com.sun.tools.javac.util.List.nil());
          var context = privateCompiler.compilerContext;
          var symbol = ClassFinder.instance(context).loadClass(Symtab.instance(context).unnamedModule,
                  Names.instance(context).fromString(binaryName));
          var name = symbol.getQualifiedName().toString();
          SemanticAnalysis.checkLaunchable(symbol);
          if (name.isEmpty()) {
              throw new IllegalArgumentException("Unnameable main class: " + binaryName);
          }
          return new MainClass(binaryName, name);
      } finally {
          privateCompiler.closeCompiler();
      }
  }

  @JSExport
  public EditorCompletion[] complete(String fileName, int offset) {
      var canonical = requireAnalysis();
      var prefix = canonical.prefix(fileName, offset);
      var overlay = new Compiler();
      overlay.sdkFiles.putAll(sdkFiles);
      overlay.classFiles.putAll(classFiles);
      overlay.sourceFiles.putAll(sourceFiles);
      String original = canonical.text(fileName);
      String placeholder = "\u0024EditorCompletion";
      while (original.contains(placeholder)) {
          placeholder += "$";
      }
      overlay.addSourceFile(fileName, original.substring(0, prefix[0]) + placeholder
              + original.substring(prefix[1]));
      try {
          overlay.analyze();
          return overlay.requireAnalysis().complete(fileName, prefix[0], placeholder, prefix[0], prefix[1],
                  original.substring(prefix[0], offset));
      } finally {
          overlay.disposeAnalysis();
      }
  }
---
