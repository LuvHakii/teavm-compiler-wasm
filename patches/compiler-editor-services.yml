id: compiler-simple-analyze
language: java
files: [compiler/src/main/java/org/teavm/javac/Compiler.java]
metadata: { expect: 1 }
rule:
  kind: method_declaration
  pattern: $F
  has: { field: name, regex: ^simpleCompile$ }
fix: |-
  boolean simpleAnalyze() {
      shouldStopPolicyIfError = CompileState.FLOW;
      shouldStopPolicyIfNoError = CompileState.FLOW;
      var files = sourceFiles.values().stream().map(x -> (JavaFileObject) x).toList();
      var parsed = parseFiles(files);
      units = new ArrayList<>(parsed);
      enterTrees(initModules(parsed));
      flow(attribute(todo));
      reportDeferredDiagnostics();
      return log.nerrors == 0;
  }

  boolean simpleCompile() {
      var files = sourceFiles.values().stream().map(x -> (JavaFileObject) x).toList();
      var parsed = stopIfError(CompileState.ENTER, parseFiles(files));
      units = new ArrayList<>(parsed);
      enterTrees(stopIfError(CompileState.ENTER, initModules(parsed)));
      var attributed = flow(attribute(todo));
      new SemanticAnalysis(compilerContext, units, sourceFiles, classFiles, sdkFiles).captureMains(sourceMains);
      generate(desugar(attributed));
      reportDeferredDiagnostics();
      return log.nerrors == 0;
  }
