id: file-system-provider-input-stream
language: java
files: [org/teavm/classlib/java/nio/file/impl/TDefaultFileSystemProvider.java]
metadata: { expect: 1 }
rule:
  kind: method_declaration
  has: { field: name, regex: ^newInputStream$ }
fix: |-
  @Override
  public InputStream newInputStream(TPath path, TOpenOption... options) throws IOException {
      java.util.Objects.requireNonNull(path);
      for (var option : options) {
          java.util.Objects.requireNonNull(option);
          if (option != TStandardOpenOption.READ) {
              throw new UnsupportedOperationException("Unsupported input option: " + option);
          }
      }
      var fs = (org.teavm.runtime.fs.wasi.WasiFileSystem)
              org.teavm.runtime.fs.VirtualFileSystemProvider.getInstance();
      return new TFileInputStream(fs.openChannel(path.toString(), java.util.Set.of(TStandardOpenOption.READ)));
  }
---
id: file-system-provider-output-stream
language: java
files: [org/teavm/classlib/java/nio/file/impl/TDefaultFileSystemProvider.java]
metadata: { expect: 1 }
rule:
  kind: method_declaration
  has: { field: name, regex: ^newOutputStream$ }
fix: |-
  @Override
  public OutputStream newOutputStream(TPath path, TOpenOption... options) throws IOException {
      java.util.Objects.requireNonNull(path);
      var modes = new java.util.HashSet<TOpenOption>();
      if (options.length == 0) {
          modes.add(TStandardOpenOption.CREATE);
          modes.add(TStandardOpenOption.TRUNCATE_EXISTING);
      } else {
          for (var option : options) {
              java.util.Objects.requireNonNull(option);
              if (option == TStandardOpenOption.READ) {
                  throw new UnsupportedOperationException("READ on output stream");
              }
              modes.add(option);
          }
      }
      modes.add(TStandardOpenOption.WRITE);
      var fs = (org.teavm.runtime.fs.wasi.WasiFileSystem)
              org.teavm.runtime.fs.VirtualFileSystemProvider.getInstance();
      return new TFileOutputStream(fs.openChannel(path.toString(), modes));
  }
