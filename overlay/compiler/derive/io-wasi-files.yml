id: reader-transfer-to
language: java
files: [org/teavm/classlib/java/io/TReader.java]
metadata: { expect: 1 }
rule:
  kind: method_declaration
  pattern: $F
  has: { field: name, regex: ^skip$ }
fix: |-
  public long transferTo(TWriter out) throws IOException {
      java.util.Objects.requireNonNull(out);
      var buffer = new char[8192];
      long transferred = 0;
      int count;
      while ((count = read(buffer, 0, buffer.length)) >= 0) {
          out.write(buffer, 0, count);
          transferred += count;
      }
      return transferred;
  }

  $F
---
